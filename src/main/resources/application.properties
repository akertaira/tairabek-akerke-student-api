spring.application.name=tairabek-akerke-student-api
app.version=${APP_VERSION:1.0.0}
server.port=8080

# Values come from environment variables (docker-compose / .env). Never hardcode passwords.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:student}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
